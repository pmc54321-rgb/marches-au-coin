<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17202a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Marchés Au Coin"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><title>Marchés Au Coin</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px 15px 40px}h1{font-size:29px;margin:4px 0}.sub{color:#66717d;margin:0 0 18px}.panel,.day,.card{background:#fff;border:1px solid #e1e4e8;border-radius:18px}.panel{padding:15px}.row{display:flex;gap:9px;flex-wrap:wrap}.grow{flex:1;min-width:200px}label{display:block;font-size:12px;color:#66717d;margin:0 0 5px}input,button{font:inherit;min-height:46px;border-radius:12px;padding:10px 13px}input{width:100%;border:1px solid #cbd1d7}button{border:0;background:#17202a;color:#fff;font-weight:600}.secondary{background:#edf0f2;color:#17202a}#status{font-size:13px;color:#66717d;margin-top:10px;min-height:18px}.day{padding:15px;margin-top:12px}.day h2{font-size:18px;margin:0 0 10px;text-transform:capitalize}.card{padding:13px;margin-top:9px}.card h3{margin:0 0 5px;font-size:16px}.meta{font-size:14px;color:#56616c;line-height:1.45}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links a{display:inline-block;text-decoration:none;background:#edf0f2;color:#17202a;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600}.badge{font-size:11px;background:#eef0f2;padding:4px 7px;border-radius:999px;margin-left:5px}.empty{color:#687481;font-size:14px;padding:8px 0}footer{font-size:12px;color:#7a838c;margin-top:16px;line-height:1.45}</style></head><body><main class="wrap"><h1>Marchés Au Coin</h1><p class="sub">Les marchés ouverts dans les 3 prochains jours, à moins de 20 km.</p><section class="panel"><div class="row"><div class="grow"><label for="location">Position / ville / code postal</label><input id="location" placeholder="Utiliser ma position ou saisir une ville"></div><div style="width:110px"><label for="radius">Rayon</label><input id="radius" value="20" inputmode="numeric"></div></div><div class="row" style="margin-top:10px"><button id="locate">Utiliser ma position</button><button id="go" class="secondary">Rechercher</button></div><div id="status" aria-live="polite"></div></section><div id="results"></div><footer>Les résultats sont issus de sources web et peuvent changer. Les boutons « Itinéraire » ouvrent directement Google Maps. La position GPS n'est envoyée qu'au serveur lors d'une recherche et n'est pas enregistrée.</footer></main><script>
const $=s=>document.querySelector(s),loc=$("#location"),rad=$("#radius"),status=$("#status"),out=$("#results");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const maps=q=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q);
function render(data){out.innerHTML="";(data.days||[]).forEach(day=>{const sec=document.createElement("section");sec.className="day";sec.innerHTML="<h2>"+esc(day.label)+"</h2>";if(!day.markets?.length)sec.innerHTML+="<div class=empty>Aucun marché confirmé dans le rayon.</div>";(day.markets||[]).forEach(m=>{const c=document.createElement("article");c.className="card";c.innerHTML="<h3>"+esc(m.name)+" <span class=badge>"+esc(m.distance_km)+" km</span></h3><div class=meta>"+esc(m.town||"")+" · "+esc(m.hours||"Horaires non indiqués")+"<br>"+esc(m.type||"Marché")+"</div><div class=links><a target=_blank rel=noopener href='"+maps(m.address||m.name+", "+(m.town||""))+"'>Itinéraire Google Maps</a>"+(m.source_url?"<a target=_blank rel=noopener href='"+esc(m.source_url)+"'>Source</a>":"")+"</div>";sec.appendChild(c)});out.appendChild(sec)})}
async function search(){let r=Math.max(1,Math.min(100,parseFloat(rad.value)||20));rad.value=r;status.textContent="Recherche des marchés…";out.innerHTML="";try{const body={radius_km:r};if(loc.value.trim())body.location=loc.value.trim();else if(window._coords)body.coords=window._coords;const res=await fetch("/api/markets",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error||"Erreur");status.textContent="Résultats trouvés pour "+data.reference+".";render(data)}catch(e){status.textContent="Impossible de récupérer les résultats: "+e.message}}
$("#go").addEventListener("click",search);$("#locate").addEventListener("click",()=>{if(!navigator.geolocation){status.textContent="Géolocalisation indisponible.";return}status.textContent="Obtention de votre position…";navigator.geolocation.getCurrentPosition(p=>{window._coords={lat:p.coords.latitude,lng:p.coords.longitude};loc.value="Position actuelle";search()},()=>status.textContent="Position indisponible. Saisissez une ville ou un code postal.",{enableHighAccuracy:true,timeout:12000})});if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
